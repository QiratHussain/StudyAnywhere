{% extends "base.html" %}

{% block title %}Home | StudyAnywhere{% endblock %}

{% block content %}
<div class="row home-hero align-items-stretch g-4">

  <!-- LEFT HALF: heading, subheading, cards -->
  <div class="col-md-6 d-flex flex-column justify-content-center">
    <div class="mb-5">
      <h1 class="display-5 fw-bold">Your Heading Here</h1>
      <p class="lead text-muted">Your subheading goes here, a short line describing what this is about.</p>
    </div>

    <div class="row g-4">
      <div class="col-sm-6">
        <a href="{{ url_for('register') }}" class="text-decoration-none">
          <div class="card action-card card-signup h-100 text-center">
            <div class="card-body py-5">
              <h4 class="card-title">Sign Up</h4>
              <p class="card-text mb-0">Create a new account</p>
            </div>
          </div>
        </a>
      </div>

      <div class="col-sm-6">
        <a href="{{ url_for('login') }}" class="text-decoration-none">
          <div class="card action-card card-login h-100 text-center">
            <div class="card-body py-5">
              <h4 class="card-title">Login</h4>
              <p class="card-text mb-0">Access your account</p>
            </div>
          </div>
        </a>
      </div>
    </div>
  </div>

  <!-- RIGHT HALF: image -->
  <div class="col-md-6 hero-col d-none d-md-flex">
    <img src="{{ url_for('static', filename='assets/images/study.jpg') }}"
         alt="Student studying" class="hero-img">
  </div>

</div>
{% endblock %}
